id: cc-brendle-12
area: cardinal-characteristics
title: "Brendle-Fischer Problem 12 -- is b < a < s consistent?"
statement: >
  Is it consistent that b < a < s? Brendle sketches the natural approach -- a
  three-dimensional matrix iteration adding Cohen reals in one direction, taking
  ultrapowers in the second, and forcing with Mathias forcing relative to a
  carefully constructed ultrafilter in the third -- and identifies the obstacle:
  "we do not know how to show the completeness of all the embeddings in this
  three-dimensional setting". Raghavan and Shelah proved the consistency of
  b < s < a using Boolean ultrapowers assuming a supercompact cardinal.

sources:
  - url: https://www.kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2042-01.pdf
    what: "Brendle, RIMS Kokyuroku 2042 (2017). Problem 12, p.7, attributed to Brendle and Fischer, with the three-dimensional matrix iteration discussion following it."
    tier: PRIMARY

