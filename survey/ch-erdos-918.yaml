axis_rationale: >
  D=3 and this is the highest witness-representability score in the survey. The
  answer is a graph on aleph_2 vertices -- not finite -- but constructions of this
  kind in the Erdos-Hajnal-Shelah tradition are given by finite recipes over
  ordinals. That is precisely the D=3 anchor: "a finite description generating an
  infinite family", the sawin-unit-distance-explicit shape.
  Route W is still blocked, by B1=0. Verifying that a proposed graph works means
  checking a statement about every aleph_1-sized subgraph. There is nothing to run.
  That combination -- the survey's best witness paired with no evaluator -- is the
  single cleanest illustration of why the B-split introduced in v1.1 matters.
  G0 and formalizable_without_ambiguity are both marked down on the source's own
  note that it is unclear whether the general-subgraph version is open, and that
  the original paper is about induced subgraphs. The statement has a genuine
  ambiguity, recorded by the formalizers themselves.

unverifiable_claims:
  - "DeepMind's own formalisation note says 'It is not clear whether this question for general subgraphs is open or not.' G0 = null follows from the source, not from my failure to search."
