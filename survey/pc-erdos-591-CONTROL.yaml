axis_rationale: >
  Scored to fail G0, which is the correct treatment and the whole reason this row
  exists. The problem was closed in 2010; two independent AI systems found the
  paper in 2026 and both were logged GREEN. Without G0 this is indistinguishable
  from a discovery, and it is the same failure mode as the October 2025 GPT-5
  episode and gpt5pro-convex-optimization-bound in the Phase 1 corpus.
  It is also the only GREEN primary-or-secondary AI outcome in this territory
  that is not a formalization -- and it is retrieval.

unverifiable_claims:
