                        - cell [ref=f26e57]:
                          - text: At the moment, a majority of conjectures on Written on Wall II are lower bounds on the maximum order of certain induced subgraphs of a connected graph. The bipartite number of a graph is the order of a largest induced bipartite subgraph of the graph; the forest, tree and path numbers are the orders of largest induced forests, trees and paths, resp., of a graphs.
                          - paragraph [ref=f26e58]: "The diagram below (you may have to scroll down) illustrates the relationship between (by means of a solid line) the bipartite, forest, tree and path numbers, namely that bipartite number ≥ forest number ≥ tree number ≥ path number. The diagram presents other correct relations also through solid lines using the convention that a line emanating from an invariant down to an expression of invariants represents the relation greater than or equal to. For instance, it is known that for a simple connected graph, the path number ≥ 2*radius - 1 (a result of F. Chung in [ESS]). On the other hand, a dashed line indicate a conjectured relation between the expressions. For instance, G.pc's conjecture #17 is that for a simple connected graph, the bipartite number ≥ independence number + CEIL[(1/3)diameter] (to see all open conjectures of G.pc click on the menu on the left). Relations that are not referenced with a paper or conjecture number are simple exercises, such as bipartite number ≥ forest number ≥ tree number ≥ path number ≥ diameter + 1; such relations are listed in order to emphasize that many of G.pc's conjectures on maximum induced subgraphs propose improvements on these simple propositions."
