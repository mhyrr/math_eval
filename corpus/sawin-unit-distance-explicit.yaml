id: sawin-unit-distance-explicit
title: "Explicit unit-distance exponent: human follow-through on the AI disproof"
date: 2026-05
status: RESOLVED

problem_statement: >
  The OpenAI disproof of Erdős #90 established that n points can determine more
  than n^(1+eps) unit distances but did NOT name eps. Sawin followed the same
  number-theoretic line - constructing algebraic number fields of large degree
  and small discriminant with many primes of small norm via a
  Golod-Shafarevich criterion - and produced the explicit bound n^1.014.
  Reported subsequently refined to n^1.0318, with 1.2143 established as the
  ceiling of this method.

field: Discrete Geometry
subfield: Combinatorial geometry / algebraic number theory

ai_system: "NONE for this paper. Follows a route opened by the OpenAI model."
human_collaborators:
