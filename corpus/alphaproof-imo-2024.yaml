id: alphaproof-imo-2024
title: "AlphaProof / AlphaGeometry 2: IMO 2024 silver-medal standard (competition baseline)"
date: 2024-07
status: RESOLVED

problem_statement: >
  Google DeepMind's AlphaProof (reinforcement learning over formal Lean proofs)
  and AlphaGeometry 2 solved four of six problems at the 2024 International
  Mathematical Olympiad, reaching silver-medal standard - one point short of
  gold. Problems were manually translated into formal statements before the
  systems ran; the systems took up to three days on some problems against the
  4.5 hours humans are allowed.

