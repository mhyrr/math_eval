          - text: Jan 12, 2006. Note one can rewrite the hypothesis of this conjecture as
          - generic [ref=f32e4388]: n - σ(G) - 1 ≤ upper median of degree sequence of G],
          - text: where
          - generic [ref=f32e4389]: σ(G)
          - generic [ref=f32e4390]: is the 2nd smallest of the degree sequence of G.
          - text: The following theorem is an analogue to Chvatal's condition for hamiltonian cycle (see D. West's Intro. to Graph Theory.) from which below it is proven that the conjecture follows.
          - paragraph [ref=f32e4391]:
            - text: Theorem (Chvatal's).
            - generic [ref=f32e4392]:
              - text: Let G be a simple graph with degree sequence d
              - subscript [ref=f32e4393]: "1"
              - text: ≤ d
              - subscript [ref=f32e4394]: "2"
              - text: ≤ ...≤ d
              - subscript [ref=f32e4395]: "n"
              - text: with n at least 3. If for i < (n+1)/2 we have that d
              - subscript [ref=f32e4396]: i
              - text: ≥ i or d
              - subscript [ref=f32e4397]: n+1-i
              - text: ≥ n-i. , then G has a Hamiltonian path.
          - paragraph [ref=f32e4398]:
            - text: Lemma.
            - generic [ref=f32e4399]: If n is at least 2, then [n - σ(G) - 1 ≤ upper median of degree sequence of G] implies Chvatal's condition.
          - paragraph [ref=f32e4400]:
            - text: Proof. Assume that n is at least 2 and
            - generic [ref=f32e4401]: n - σ(G) - 1 ≤ upper median of degree sequence of G .
            - text: Observe that our assumption implies
          - paragraph [ref=f32e4402]:
            - generic [ref=f32e4403]:
              - text: d
              - subscript [ref=f32e4404]: (n+2)/2
