id: ch-erdos-918
area: ch-adjacent-combinatorics
title: "Erdos #918 -- a graph of chromatic number aleph_2 whose aleph_1-sized subgraphs are countably chromatic"
statement: >
  Is there a graph with aleph_2 vertices and chromatic number aleph_2 such that
  every subgraph on aleph_1 vertices has chromatic number at most aleph_0? A
  companion part asks for a graph with aleph_(omega+1) vertices and chromatic
  number aleph_1 such that every subgraph on aleph_omega vertices has chromatic
  number at most aleph_0. Due to Erdos and Hajnal.

sources:
  - url: https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/ErdosProblems/918.lean
    what: "Lean statement, four parts each `@[category research open, AMS 5]` at repo HEAD 7587c62 (2026-07-25), in both induced-subgraph and general-subgraph forms. A formalisation note records that the source [ErHa68b] uses only induced subgraphs and that it is unclear whether the general-subgraph question is open."
    tier: PRIMARY

