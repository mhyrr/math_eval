id: brd-dobrinen-6-3
area: big-ramsey-degrees
title: "Dobrinen Problem 6.3 -- big Ramsey structures and the KPT correspondence"
statement: >
  Does every homogeneous structure with finite big Ramsey degrees also carry a big
  Ramsey structure? Is there an exact correspondence, in the vein of the
  Kechris-Pestov-Todorcevic correspondence, between big Ramsey structures and
  topological dynamics?

sources:
  - url: https://arxiv.org/abs/2110.00655
    what: "Dobrinen, ICM 2022 Proceedings. Problem 6.3, p.18. Notes Zucker's work established a connection 'but not a complete correspondence yet'."
    tier: PRIMARY
  - url: https://arxiv.org/abs/2407.17958
    what: "Hubicka and Zucker, 'A survey on big Ramsey structures' (2024-07-25, rev 2025-06-05). Unifies scattered results and shows standard proof methods automatically yield big Ramsey structures -- bears directly on the first half of 6.3."
    tier: PRIMARY

