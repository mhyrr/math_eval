notes: >
  Included largely for the disclaimer, which is the most calibrated public
  statement by any lab in this corpus. DeepMind ran its own four-level
  significance scale and placed its own autonomous results below "Major
  Advance." Compare the October 2025 OpenAI Erdős episode and the Axiom claim.

  For the rubric: benchmark performance and research contribution decouple.
  The same system scores up to 90% on IMO-ProofBench Advanced and ~38% on
  PhD-level FutureMath, and yields four Erdős problems that its own builders
  decline to call major advances. Olympiad-style capability does not read
  across to research tractability, and any rubric axis that leans on benchmark
  scores as a proxy will be badly calibrated.
