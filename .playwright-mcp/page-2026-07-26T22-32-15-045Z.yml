          - paragraph [ref=f32e13525]: "June 2013, Pepper wrote the following: \"Let R_k, CT_k, a_k be the k-Residue, k-Caro-Tuza, and k-independence respectively. Also, let n be order and m be size."
          - paragraph [ref=f32e13526]: "Theorem(s): (Jelen 1999) a_k >= R_k >= CT_k"
          - paragraph [ref=f32e13527]: "Observation: (Jelen 1999) For k < D, where D means max degree, CT_k = n â€“ m/k"
          - paragraph [ref=f32e13528]: "Theorem: (Pepper 2004) For k >= D, where D means max degree, R_k = n â€“ m/k"
          - paragraph [ref=f32e13529]: "Corollaries: a_k >= R_k >= n â€“ m/k"
          - paragraph [ref=f32e13530]: "Randy and G.pc Conjecture: a_k >= |A| - |E(G[A])|/k"
          - paragraph [ref=f32e13531]: "Proof: Let A be a set of vertices in graph G. Then a_k(G) >= a_k([A]) >= R_k([A]) >= n([A]) â€“ m([A])/k = |A| - |E(G[A])|/k.\""
          - paragraph [ref=f32e13532]
