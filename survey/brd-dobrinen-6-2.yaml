id: brd-dobrinen-6-2
area: big-ramsey-degrees
title: "Dobrinen Problem 6.2 -- replace forcing proofs with purely combinatorial ones"
statement: >
  For results whose proofs use the method of forcing, find new proofs which are
  purely combinatorial. Dobrinen notes this has been done for the triangle-free
  graph by Hubicka, but that "new methods will be needed for k-clique-free
  homogeneous graphs for k >= 4 and other such FAP classes."

sources:
  - url: https://arxiv.org/abs/2110.00655
    what: "Dobrinen, ICM 2022 Proceedings. Problem 6.2, p.18, with the Hubicka precedent and the k >= 4 gap stated in the following paragraph."
    tier: PRIMARY
  - url: https://arxiv.org/abs/2009.00967
    what: "Hubicka, 'Big Ramsey degrees using parameter spaces' -- the cited combinatorial replacement for the triangle-free case."
    tier: PRIMARY

