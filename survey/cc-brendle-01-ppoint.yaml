id: cc-brendle-01-ppoint
area: cardinal-characteristics
title: "Brendle Problem 1 -- assume CH and add random reals: is there a P-point?"
statement: >
  Assume CH and add any number of random reals. Is there a P-point? Brendle
  writes: "We strongly conjecture this is correct because it does hold for some CH
  models", and records Kunen's observation that adding first omega_1 Cohen reals
  and then any number of random reals does give a P-point.

sources:
  - url: https://www.kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2042-01.pdf
    what: "Brendle, RIMS Kokyuroku 2042 (2017). Problem 1, p.4, with Observation 1 (Kunen) and proof sketch following. Also records that Cohen 'claimed there is a P-point in the standard random model... but his argument is flawed (as pointed out by Guzman and Hrusak)'."
    tier: PRIMARY

