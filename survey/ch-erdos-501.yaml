axis_rationale: >
  E=2: Hechler settled it negatively under CH, so what remains is the behaviour
  when CH fails. That is the definition of the "ZFC status genuinely unknown"
  band -- half the question is a theorem and half is model-dependent.
  C=3: the problem mixes measure theory with infinite combinatorics and the Lean
  formalization pulls in MeasureTheory.volume.toOuterMeasure. Cross-field by
  construction, which is the Gowers MIXED shape, but both fields have already
  been asked -- the Newelski-Pawlikowski-Seredynski closed-set result is exactly
  that import, done in 1987.
  B2=2: mathlib's measure theory is mature and the statement compiles. The
  ambient theory for the OPEN case, which is independence-flavoured, is not
  covered.
  Note the wiki entry is a CONDITIONAL partial result, still unverified after a
  month. Consistent with the rest of this territory.

