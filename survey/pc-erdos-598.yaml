axis_rationale: >
  E=2: the statement is parameterised by (2^aleph_0)^+, so its truth is entangled
  with the value of the continuum. Whether ZFC settles it is not established and
  the answer plausibly varies by model. This is the "specialists split" band.
  A=1: verifying a colouring of [m]^omega with kappa colours has the shape of the
  erdos-1196 anchor, not the erdos-90 one -- there is no short certificate and
  the checking community is small.
  This problem is the survey's clearest instance of the pattern the wiki records:
  a named human plus a frontier model produced a candidate partial result in
  April 2026 which was still unverified when the census froze ten weeks later.
  A=1 is the reason. Nobody could cheaply check it.

unverifiable_claims:
  - "The content of the Chojecki candidate partial result is not recorded on the wiki beyond the WHITE colour code and the phrase 'Candidate partial result'. Whether it is correct, and what it claims, is unknown to this survey."
