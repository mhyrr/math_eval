id: pc-erdos-70
area: partition-calculus
title: "Erdos #70 -- the 3-uniform partition relation c -> (omega*2, 4)^3_2"
statement: >
  Does the ordinal partition relation c -> (omega*2, 4)^3_2 hold, where c is the
  cardinality of the continuum? Erdos and Rado proved c -> (omega + n, 4)^3_2 for
  every finite n >= 2, which covers every red ordinal strictly below omega*2 =
  omega + omega. The open case asks whether the result extends to beta = omega*2,
  the simplest countable ordinal their theorem does not reach.

