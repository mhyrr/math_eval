id: cc-mejia-16
area: cardinal-characteristics
title: "Mejia Problem 16 -- is cov(M) < d < non(N) < cof(N) consistent?"
statement: >
  Is it consistent that cov(M) < d < non(N) < cof(N)? A Cichon-diagram
  constellation on the right-hand side of the diagram. Brendle notes that "the
  consistency dual to (*) above is not known because it is unclear what 'going
  through subalgebras of ...' should be replaced with. The most promising choice
  is a multi-dimensional matrix iteration."

sources:
  - url: https://www.kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2042-01.pdf
    what: "Brendle, RIMS Kokyuroku 2042 (2017). Problem 16, p.8, attributed to Mejia, in the section on Cichon's diagram constellations."
    tier: PRIMARY
  - url: https://ems.press/journals/jems/articles/3375044
    what: "Goldstern, Kellner, Mejia, Shelah, 'Cichon's maximum without large cardinals', JEMS (2022). Establishes that all ten Cichon values can be separated without large cardinals, superseding the earlier four-strongly-compact construction."
    tier: PRIMARY

