id: ch-erdos-602
area: ch-adjacent-combinatorics
title: "Erdos #602 -- Property B for almost disjoint families of countable sets"
statement: >
  Does every almost-disjoint family of countably infinite sets, whose pairwise
  intersections all have size not equal to 1, have Property B? That is, is there a
  2-colouring of the ground set under which no member of the family is
  monochromatic?

