id: brd-uncountable
area: big-ramsey-degrees
title: "Big Ramsey degrees at uncountable cardinals (kappa-rationals, kappa-Rado graph)"
statement: >
  Extend the theory of big Ramsey degrees from countable homogeneous structures to
  uncountable ones. Shelah proved, assuming certain large cardinals, that the
  Halpern-Lauchli theorem holds for trees 2^(<kappa) where kappa is measurable;
  Dzamonja, Larson and Mitchell used a modification to characterise big Ramsey
  degrees for the kappa-rationals and the kappa-Rado graph. Dobrinen describes the
  field for uncountable homogeneous structures as "still quite open".

sources:
  - url: https://arxiv.org/abs/2110.00655
    what: "Dobrinen, ICM 2022 Proceedings, p.19. Quotes the large-cardinal dependence and the 'still quite open' assessment. Cites Dzamonja-Larson-Mitchell and Zhang's tail cone version of Halpern-Lauchli at a large cardinal."
    tier: PRIMARY

