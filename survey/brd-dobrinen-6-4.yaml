id: brd-dobrinen-6-4
area: big-ramsey-degrees
title: "Dobrinen Problem 6.4 -- infinite-dimensional Ramsey theory on spaces of copies"
statement: >
  Develop infinite dimensional Ramsey theory on spaces of copies of a homogeneous
  structure. The finite-dimensional Galvin-Prikry and Ellentuck theorems describe
  the Baire space; the question asks for extensions to subspaces of [omega]^omega
  where each infinite set represents a copy of a fixed homogeneous structure.
  Dobrinen proved a Galvin-Prikry style theorem for the Rado graph.

sources:
  - url: https://arxiv.org/abs/2110.00655
    what: "Dobrinen, ICM 2022 Proceedings. Problem 6.4, p.19. States a theorem for SDAP+ structures with relations of arity at most two 'is being written down by the author'."
    tier: PRIMARY

