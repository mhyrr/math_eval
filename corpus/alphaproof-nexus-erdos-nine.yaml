id: alphaproof-nexus-erdos-nine
title: "AlphaProof Nexus: nine Erdős problems resolved by LLM + Lean search"
date: 2026-05
status: RESOLVED
companion_problems: ["#12(i)", "#12(ii)", "#125", "#138 (variant)", "#152", "#741(i)", "#741(ii)", "#26 (variant)", "#846"]

problem_statement: >
  Nine open problems from the Erdős database, spanning divisibility-constrained
  sets of prescribed density (#12), sumset density of base-3/base-4 digit sets
  (#125), van der Waerden number growth (#138 variant), Sidon sets with
  isolated points (#152), partitions with positive-density sumsets and basis
  constructions defeating syndetic partitions (#741), sequences avoiding
  multiples under bounded upper density (#26 variant), and non-collinear point
  sets (#846). Two had been open 56 years.

field: Number Theory / Combinatorics
subfield: Additive combinatorics, density and Ramsey-type problems

ai_system: "AlphaProof Nexus (Google DeepMind) - LLM generation in a loop with the Lean compiler; agent variants A/B/C/D"
human_collaborators:
  - "George Tsoukalos, Anton Kovsharov, Sergey Shirobokov et al. (Google DeepMind, Aarhus University) - built the system, selected and formalized problem statements"
autonomy: AUTONOMOUS
# Autonomous within the formalized statement. The human bottleneck moved
# upstream: someone must write the Lean statement correctly, and an error
# there fails silently.

resolution_mechanism:
  primary: SEARCH_PLUS_VERIFIER
  secondary: []
  contested: false
# The purest instance of the category. Generation is unreliable and cheap;
# the Lean compiler is the ground truth; the loop runs until it closes.

certificate_size: SMALL
certificate_notes: >
  Machine-checked Lean proofs, additionally validated in a SafeVerify sandbox
  confirming no disallowed axioms were introduced. Verification cost for a
  skeptic is compile time plus a reading of the Lean *statement* - which is
  where the real risk sits, not in the proof.

verification_method: LEAN
verification_status: >
  arXiv 2605.22763, 2026-05-21. Formally verified end to end. The residual
  risk is statement-formalization error, not proof error.

cross_field_transfer:
  occurred: false
  from: null
  to: null
  notes: "Successes concentrate inside domains where mathlib is already mature; nothing imported from outside."

