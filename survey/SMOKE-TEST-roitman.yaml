id: roitman-problem
statement: >
  Roitman's problem in cardinal characteristics of the continuum: does
  d = aleph_1 imply a = aleph_1? Here d is the dominating number and a is the
  least cardinality of a maximal almost disjoint family of infinite subsets of
  omega. Reported long-standing open; NOT SOURCED in this pass.

