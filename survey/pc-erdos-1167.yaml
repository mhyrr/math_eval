id: pc-erdos-1167
area: partition-calculus
title: "Erdos #1167 -- the Erdos-Hajnal-Rado stepping-down question"
statement: >
  Let r >= 2 be finite, gamma >= 2, lambda an infinite cardinal, and kappa_alpha
  cardinals for alpha < gamma. Does 2^lambda -> (kappa_alpha + 1)^(r+1) imply
  lambda -> (kappa_alpha)^r? A problem of Erdos, Hajnal and Rado.

sources:
  - url: https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/ErdosProblems/1167.lean
    what: "Lean statement, `@[category research open, AMS 5]` at repo HEAD 7587c62 (2026-07-25). Also formalizes four sub-cases (finite targets, binary colours, infinite targets, r=2) each independently marked research open, plus a test showing the unrestricted form is false."
    tier: PRIMARY

