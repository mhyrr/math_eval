id: erdos-90-unit-distance
title: "Erdős #90: disproof of the unit distance conjecture"
date: 2026-05
status: RESOLVED
companion_problems: ["#92 (also disproved)", "#52 (inspired follow-up)"]

problem_statement: >
  Erdős (1946) asked for the maximum number u(n) of unit distances determined
  by n points in the plane. He conjectured u(n) <= n^(1+c/log log n) - i.e.
  barely superlinear, matching the square-grid construction, with no power
  saving. An OpenAI internal reasoning model disproved this, exhibiting point
  configurations with more than n^(1+eps) unit distances for infinitely many
  n. The gap between grid-like behaviour and polynomial excess had stood
  ~80 years.

field: Discrete Geometry
subfield: Combinatorial geometry / incidence geometry

ai_system: "Unnamed OpenAI internal general-purpose reasoning model (not a specialist prover)"
human_collaborators:
  - "Noga Alon, Thomas F. Bloom, W. T. Gowers, Daniel Litt, Will Sawin, Arul Shankar, Jacob Tsimerman, Victor Wang, Melanie Matchett Wood - authors of the digest paper; verified and rewrote the argument"
autonomy: AI_LED_HUMAN_VERIFIED
# OpenAI published the initiating prompt and the model's chain of thought.
# Human involvement described as minimal beyond the prompt, with verification
# and exposition after the fact. This is the strongest autonomy claim in the
# corpus attached to a genuinely frontier result.

resolution_mechanism:
  primary: NOVEL_ARGUMENT
  secondary: [CONSTRUCTION]
  contested: false
# NOT primarily CONSTRUCTION, despite being a counterexample. The model's
# exponent was INEXPLICIT: it proved existence of configurations beating
# n^(1+eps) without naming eps. There is no finite object to hand a skeptic.
# Sawin's follow-up (arXiv 2605.20579) supplied the explicit 1.014. The
# distinction matters enormously for the certificate-size axis and is easy to
# miss from press coverage.

certificate_size: MEDIUM
certificate_notes: >
  Not small: no explicit witness, and the argument runs through algebraic
  number theory - constructing number fields of large degree and small
  discriminant with many primes of small norm, via a Golod-Shafarevich
  criterion. Not large either: nine mathematicians produced a "short,
  digested, human-verified version" within days, and Gowers said he would
  recommend it to Annals without hesitation. A specialist verifies in days.
  The speed of the digest is itself the evidence for MEDIUM.

verification_method: HUMAN_REFEREEING
verification_status: >
  As strongly verified as an unrefereed result gets. Nine mathematicians -
  including Bloom (the erdosproblems.com maintainer, i.e. the person with the
  most institutional reason to be skeptical) and Gowers - co-signed a digest
  paper, arXiv 2605.20695, 2026-05-20. Sawin independently reproduced the line
  of reasoning and strengthened it to an explicit n^1.014 (arXiv 2605.20579),
  later reported refined to n^1.0318 with a ceiling of 1.2143 for the method.
  Anthropic reportedly confirmed the result with its own system. MathOverflow
  discussion open on the resulting exponent.

cross_field_transfer:
  occurred: true
  from: "Algebraic number theory (class field towers; Golod-Shafarevich; Ellenberg-Venkatesh; Hajir-Maire-Ramakrishna)"
  to: "Discrete/combinatorial geometry"
  notes: >
    The strongest cross-field transfer case in the corpus. Unit distances is a
    combinatorics problem that had been attacked with combinatorial and
    incidence-geometric tools for 80 years. The solution came from number
    fields. Gowers' caveat is essential: "many of the ideas needed for the
    proof were present in the literature already" - so the scarce resource was
    not new theory but the willingness to reach across fields for existing
    theory. That is exactly the capability profile a broad-recall model has and
    a specialist human does not.

