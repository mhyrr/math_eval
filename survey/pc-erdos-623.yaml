axis_rationale: >
  C=3: free-set theorems of this kind sit at the junction of partition calculus
  and the combinatorics of singular cardinals, where Shelah's pcf theory is the
  obvious unexploited machinery. That is a real adjacent reservoir, which is why
  this scores above the rest of the partition-calculus slice -- but pcf is not
  an unasked field in the erdos-90 sense. Set theorists know it exists. Scoring
  C=4 here would be scoring the reservoir's existence rather than its neglect.
  E=3: aleph_omega is singular, and free-set results at singulars are ZFC
  theorems in the Erdos-Hajnal tradition rather than independence phenomena.

