notes: >
  The purest optimization case in the corpus and a useful boundary marker for
  what SEARCH_PLUS_VERIFIER can reach.

  Everything favourable holds at once: the search space is finite-dimensional
  and explicitly parameterized, the objective is a single integer, the
  verifier is exact symbolic arithmetic, and partial progress is measurable so
  evolutionary search has gradient. Under those conditions a 50-year-old record
  falls.

  Include it in the corpus precisely to make the contrast with Phase 3 stark.
  A question like "is b < a consistent with ZFC" has no parameterized search
  space, no integer objective, no exact verifier, and no notion of partial
  progress. Every property that makes matrix multiplication tractable for this
  mechanism is absent. That is not a difference of degree.
