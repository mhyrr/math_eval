unverifiable_claims:
  - "The exact polynomial map above is transcribed from a secondary source (Secret Blogging Seminar) and has NOT been independently recomputed inside this project. Before this case is used as a rubric anchor, run the determinant check locally."
  - "Identity of 'Akhil' is not confirmed in any source retrieved."
  - "The role split between Claude Fable 5, GPT-5.6 'Sol', and the humans is reported inconsistently across sources. One source conflates ChatGPT and Fable. Treat the specific model attribution as reported-not-established."
  - "n=2 reported still open; not independently confirmed."

notes: >
  The most important case in the corpus for the rubric, because it is the
  extreme point on the certificate-size axis. An 87-year-old conjecture in a
  field with heavy machinery fell to an object a first-year graduate student
  can check. Nothing about the model's reliability had to be trusted.

  Contrast deliberately with erdos-1196-primitive-sets, where the AI
  contribution was a *method* and the certificate is a 35-page paper requiring
  expert refereeing. Same era, same class of tool, opposite verification cost.

  The generalization work (what the counterexample implies, whether n=2
  survives, the Dixmier consequences) is where the humans and the follow-on
  model sessions are actually spending effort. That asymmetry - cheap witness,
  expensive aftermath - is a rubric signal in its own right.

