id: cc-brendle-10
area: cardinal-characteristics
title: "Brendle-Raghavan Problem 10 -- is b = s = aleph_1 with a > aleph_1 consistent?"
statement: >
  Is it consistent that b = s = aleph_1 and a > aleph_1? Here b is the unbounding
  number, s the splitting number, a the almost-disjointness number. Brendle notes
  that in template models max{b,s} is strictly smaller than a but then b is at
  least aleph_2, and that "having the three cardinals distinct in another order is
  a much harder problem".

sources:
  - url: https://www.kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2042-01.pdf
    what: "Brendle, 'Some problems in forcing theory: large continuum and generalized cardinal invariants', RIMS Kokyuroku 2042 (2017), 1-16. Problem 10, p.7, attributed to Brendle and Raghavan."
    tier: PRIMARY

