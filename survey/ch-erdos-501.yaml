id: ch-erdos-501
area: ch-adjacent-combinatorics
title: "Erdos #501 -- infinite independent sets for families of bounded outer measure"
statement: >
  For every x in R let A_x be a bounded subset of R with outer measure < 1. Must
  there exist an infinite independent set, that is, an infinite X subset of R such
  that x not in A_y for all distinct x, y in X? Erdos-Hajnal (1960) proved
  arbitrarily large FINITE independent sets exist. Hechler (1972) showed the answer
  to the infinite question is NO assuming the continuum hypothesis.

