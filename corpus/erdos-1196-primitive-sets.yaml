classification:
  certificate_type: INFORMAL_PROOF
  process: SEEDED_COLLABORATION
  frontier: ADVANCES
  inference_mode: INDUCTION
  culture: MIXED
  rationale: >
    Model supplied the frame (von Mangoldt Markov chains); seven
    mathematicians supplied the 35 pages. SEEDED_COLLABORATION is exactly this
