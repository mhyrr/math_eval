axis_rationale: >
  B2=3, and it is the only problem in the survey where that score rests on a
  demonstration rather than an inference. The immediately neighbouring problem
  #1067 -- same ambient theory, same chromaticCardinal machinery, same
  InfinitelyConnected predicate -- was actually formalized in Lean, by Alexeev
  using Aristotle and Aleph Prover, in January 2026. The library demonstrably
  covers this corner because someone compiled a proof in it.
  A=3: the resolution of #1067 went from a consistency result (Komjath 2013) to a
  ZFC construction (Soukup 2015) to "a simpler elementary example" (Bowler-Pitz
  2024). That trajectory -- towards a short, checkable, ZFC certificate -- is the
  best evidence in the survey that this corner of infinite graph theory has
  genuinely cheap certificates available.
  E=3: #1067 was settled in ZFC, so the neighbourhood is not independence-bound
  even though its earliest resolutions were consistency results.
  This is the closest thing to a candidate the survey contains, and the reason is
  worth stating plainly: it is the one problem where a proof assistant has been
  shown to reach the ambient theory AND the neighbouring result turned out to have
  an elementary ZFC proof. Both facts are about #1067, not about #1068.

unverifiable_claims:
  - "The Aristotle/Aleph Prover formalization of #1067 is a TRANSLATION of the Bowler-Pitz proof, not a discovery. The wiki logs it in section 2(b) (Formalization) with prior literature GREEN. Nothing here shows an AI system finding an argument in this area."
  - "Whether #1068 is genuinely harder than #1067 or merely unattacked is not established. If it is the latter, the honest verdict would be Route N -- but prior_attention is HIGH by construction in this territory and I have no evidence of neglect."
