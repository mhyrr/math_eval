axis_rationale: >
  This row carries the single most important source in Phase 3. DeepMind's
  formalizers, writing in the repo that would have to support Route F, state:
  "Shelah's result is a *consistency* statement -- it asserts the existence of a
  model of ZFC, not a ZFC theorem. Lean operates inside a single (fixed) model of
  its set theory, so we cannot directly express 'consistent with ZFC' without
  leaving ZFC. Rather than pretend that Shelah's theorem is a bare ZFC negation,
  we record it here as an explicit answer(sorry) consistency placeholder."
  That is the forcing trap resolved from the primary side, and it resolves harder
  than TAXONOMY.md guessed. The trap was flagged as "cheap to exhibit, expensive
  to check". It is worse: the certificate is not expressible in the checker at
  all. B2=1 and formalizable_without_ambiguity=false both follow directly, and no
  fifth route is needed -- Route F is structurally unavailable, not merely
  expensive.
  E=1: Shelah's consistency result means ZFC does not settle the aleph_1 case, so
  what remains live is which additional axioms do.

