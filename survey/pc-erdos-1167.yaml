axis_rationale: >
  This is the survey's best-decomposed problem: the Lean file splits it into four
  independently-stated sub-cases, which is exactly the "tasks often decompose into
  tractable subgoals" condition the AlphaProof Nexus authors name as necessary for
  their successes. It fails anyway, on B2 -- decomposition helps only if the
  ambient theory is covered, and cardinalPartitionRel had to be defined by the
  repo rather than imported from mathlib.
  E=3: a ZFC implication between partition relations, quantified over all
  cardinals. Not a consistency question, but far outside reverse-math range.

unverifiable_claims:
  - "Whether the four sub-cases are open in the same sense as the main question, or are merely unproved specializations nobody has separately attacked, is not stated in the source. All four carry `research open`."
