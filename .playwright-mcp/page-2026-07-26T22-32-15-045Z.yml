        - cell [ref=f32e1256]:
          - text: "Mar 05, 2004. Note conj. #20 of wowII is"
          - generic [ref=f32e1257]:
            - text: b(G) ≥ n/FLOOR[deg
            - subscript [ref=f32e1258]: avg
            - text: (G)].
          - paragraph [ref=f32e1259]:
            - text: Mar 06, 2004, Bill Waller observes that for graphs that are p-regular and
            - generic [ref=f32e1260]:
              - text: K
              - subscript [ref=f32e1261]: p
            - text: "-free,"
            - generic [ref=f32e1262]:
              - text: f(G) ≥ n/FLOOR[deg
              - subscript [ref=f32e1263]: avg
              - text: (G)]
            - text: follows from Fajtlowicz's result on the independence ratio that for graphs with max. degree at most p and
            - generic [ref=f32e1264]:
              - text: K
              - subscript [ref=f32e1265]: q
            - text: "-free,"
            - generic [ref=f32e1266]: a(G)/n ≥ 2/(p+q).
            - text: "[F]"
          - paragraph [ref=f32e1267]: "Mar 07, 2004, DeLaVina: I came across a paper [BB] (see reference link) by Bau and Beineke on n(G) - f(G), which they called the decycling number of a graph. In their paper they cite a result of Zheng and Lu in [ZL] that for cubic graphs without triangles and n not 8, f => n - ceil[n/3] (settling a conjecture by Bondy, Hopkins and Staton [BHS].) Zheng and Lu's bound for cubic triangle-free graphs is an improvement over the above. Bau and Beineke also cite other results on the decycling number, they write \"A sharp upper bound for the decycling number of cubic graphs has been obtained in [LZ] by Liu and Zhao and that for connected graphs with maximum degree 3 has been obtained in [AMT].\""
          - paragraph [ref=f32e1268]:
            - text: Mar. 07, 2004, Fajtlowicz sent a proof of
            - generic [ref=f32e1269]:
              - text: f(G) ≥ n/deg
              - subscript [ref=f32e1270]: avg
              - text: (G)
          - paragraph [ref=f32e1271]: "\"The algorithm is as the proof which essentially shows how to find a forest of size n/A, where A is the average degree."
          - paragraph [ref=f32e1272]: "Proof: We can assume that G has no isolated points. Let's order vertices at random and starting with empty set F, let us keep adding to F a vertex v, if F + {v} is an induced forest. We add suitable vertices to F in order they are listed. Let d be the degree of v. The probability that v will eventually land in F is at least 2/(d+1), because that's the probability that v is the first or the second on the list of v +{neighbors of v}. Adding such vertices keeps F acyclic."
          - paragraph [ref=f32e1273]: Let f(v) = 1 if v is in F and zero otherwise. By linearity, The expected value of f is at least R = sum 1/d, where the summation is over the degree sequence D, because for d >= 1, 2/(d+1) >= 1/d. Since that is the expected value then there is at least one ordering for which |F| is at least R.
          - paragraph [ref=f32e1274]: This is a version of Caro-Wei bound for forests rather than the independence number and the idea of the proof is the same as Shearer's proof of their result.
          - paragraph [ref=f32e1275]: Let H be the harmonic mean of D, i.e., H = n/R and A the average of D. Then f >= n/A follows from the inequality of arithmetic-harmonic means which says that A >= H.
          - paragraph [ref=f32e1276]: f >= R
          - paragraph [ref=f32e1277]: f/n >= R/n = 1/H >= 1/A i.e, f >= n/A
          - paragraph [ref=f32e1278]: Siemion"
        - cell [ref=f32e1279]
