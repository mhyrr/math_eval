axis_rationale: >
  G0 = null because the source list is nine years old. This is not fastidiousness:
  Brendle's own Problem 13 in the same list ("is it consistent that eight of the
  cardinals in Cichon's diagram assume distinct values?") was overtaken by
  Cichon's maximum, which separates ten. A 2017 problem list in this field cannot
  be read as current, and I did not verify this particular entry against 2024-26
  literature.
  C=2: the machinery being reached for -- templates, matrix iterations, Boolean
  ultrapowers, ultrapowers of partial orders -- is all native to the subfield and
  already deployed by the people who posed the problem. This is close to the C=0
  anchor's "the field's own techniques are the only candidates", raised to 2 only
  because matrix iterations were themselves imported from Blass-Shelah's work on
  a different question.

unverifiable_claims:
  - "Current open status unverified. A search summary reports Brendle and Raghavan asking whether b = s = omega_1 implies a = omega_1, which matches, but that summary is not a source I read."
