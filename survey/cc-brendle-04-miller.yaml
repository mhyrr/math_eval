id: cc-brendle-04-miller
area: cardinal-characteristics
title: "Miller Problem 9.1 (Brendle Problem 4) -- consistently no P-points and no Q-points?"
statement: >
  Is it consistent that there are simultaneously no P-points and no Q-points?
  Brendle notes c > aleph_2 must hold in such a model, because d = aleph_1 implies
  existence of Q-points while d = c implies (even generic) existence of P-points;
  and that since d = aleph_1 in all known models for no P-points, a simpler
  problem may be Problem 5: is it consistent that d >= aleph_2 and there are no
  P-points?

sources:
  - url: https://www.kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2042-01.pdf
    what: "Brendle, RIMS Kokyuroku 2042 (2017). Problem 4, p.5, attributed to Miller [Mi4, Problem 9.1], with the c > aleph_2 argument."
    tier: PRIMARY

