axis_rationale: >
  Scored to fail G0 -- it was resolved in 2024 and any instrument nominating it in
  2026 would be repeating the October 2025 GPT-5 failure.
  Its evidentiary value is the gap. Four authors, one of them Shelah, announced a
  separation result and later found their own proof flawed; the theorem was then
  proved by someone else with a different method. If the strongest team in the
  subfield cannot verify its own forcing construction on the first pass, A=1
  across this slice is not pessimism, it is the observed rate.

unverifiable_claims:
  - "The [GKMS21] reference and the gap are reported in Yamazoe's footnote. I did not locate a retraction, erratum, or statement from the four authors themselves."
