id: pc-erdos-591-CONTROL
area: partition-calculus
title: "Erdos #591 -- CONTROL: closed by Schipperus (2010), found twice by AI literature search"
statement: >
  A countable-ordinal partition problem resolved by Rene Schipperus, 'Countable
  partition ordinals', Annals of Pure and Applied Logic (2010), 1195-1215. Included
  as a NEGATIVE CONTROL: it is the one problem in this territory where the public
  record shows AI producing a green outcome, and the mechanism was retrieval.

