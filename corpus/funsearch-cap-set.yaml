notes: >
  The temporal baseline. Everything else in this corpus is from 2025-2026;
  FunSearch is from 2023 and already exhibits the mechanism that still
  dominates the successes: generate cheaply, verify automatically, iterate.

  Two and a half years later, AlphaEvolve is FunSearch with a better generator
  and program-level rather than object-level evolution, and AlphaProof Nexus is
  the same loop with Lean as the evaluator. The mechanism did not change. What
  changed is the range of problems that admit a cheap evaluator.

  That is a genuinely useful extrapolation base for Phase 3. The question is
  not "will models get smarter" - they demonstrably have, and the mechanism
  distribution barely moved. The question is whether the target territory
  admits a cheap evaluator at all. Cap sets do. Cardinal characteristics do
  not, and no plausible model improvement changes that, because the obstruction
  is the absence of a checkable finite witness rather than the difficulty of
  finding one.
