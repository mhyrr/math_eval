id: pc-erdos-623
area: partition-calculus
title: "Erdos #623 -- infinite free sets for a choice function at aleph_omega"
statement: >
  Let X be a set of cardinality aleph_omega and let f map the finite subsets of X
  into X with f(A) not in A for all A. Must there exist an infinite Y subset of X
  that is independent, meaning f(B) not in Y for every finite B subset of Y?

