notes: >
  Included as the competition baseline, and mainly to mark the gap between
  competition and research performance.

  Competition problems have a property that research problems do not: someone
  guarantees a solution exists, is findable in hours, and uses only known
  technique. Every axis in the rubric that matters - is it open to the field,
  is there a reservoir to import from, is there a checkable certificate -
  is trivially satisfied or irrelevant on an IMO problem.

  The corroborating evidence is in gemini-aletheia-autonomous-erdos: the same
  lineage now scores up to 90% on IMO-ProofBench Advanced and ~38% on
  PhD-level FutureMath, and produces Erdős results its own builders decline to
  call major advances. Competition capability saturating tells you almost
  nothing about research tractability. This case exists in the corpus so the
  rubric does not accidentally import a benchmark axis.
