axis_rationale: >
  C=5 and it is the only 5 in the survey. This is the erdos-90 shape stated
  outright: a body of results proved with one field's machinery (forcing), where
  the request is to reprove them with another's (parameter spaces, structural
  Ramsey theory), and where the transfer has already succeeded once. Hubicka's
  triangle-free result is the existence proof that the reservoir is real and not
  yet drained.
  G1 = FAIL, deliberately. Dobrinen states that "new methods will be needed" for
  k >= 4. That is the field's own expert saying the problem awaits a new
  framework, which is exactly the G1 FAIL condition, and it is the strongest
  single piece of evidence in the survey that C alone cannot carry a problem.
  The most reservoir-rich problem in the territory is disqualified by the axis
  the corpus found unanimous.

unverifiable_claims:
  - "Whether any of the k >= 4 cases has been given a combinatorial proof between 2021 and 2026 is not established here. Balko et al. (2025) may bear on it."
  - "This is a research programme rather than a proposition, so 'open status' is not sharply defined. G0 = null reflects that, not a failure to search."
