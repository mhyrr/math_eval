id: cc-roitman
area: cardinal-characteristics
title: "Roitman's problem -- is d = aleph_1 < a consistent?"
statement: >
  Does d = aleph_1 imply a = aleph_1? Here d is the dominating number (least size
  of a family of functions omega -> omega cofinal in the eventual-domination
  order) and a is the almost-disjointness number (least size of an infinite
  maximal almost disjoint family of subsets of omega). Asked by Roitman in the
  1970s. Equivalently: is d = aleph_1 < a consistent?

sources:
  - url: https://arxiv.org/abs/1404.7343
    what: "Mildenberger, 'A solution to Roitman's problem', submitted 2014-04-29, WITHDRAWN 2014-02-20 [sic, per arXiv: withdrawn 2015-02-20]. The withdrawal comment states 'Lemma 3.2 is flawed'. PRIMARY evidence that a claimed solution by a specialist stood publicly for roughly ten months before being retracted."
    tier: PRIMARY
  - url: https://www.logic.univie.ac.at/~vfischer/schilhan1.pdf
    what: "Schilhan, 'Bounding, splitting and almost disjointness'. Cited via search summary for the statement that the consistency of d = omega_1 < a remains open; the specific page was not read."
    tier: EXPERT_COMMENTARY

