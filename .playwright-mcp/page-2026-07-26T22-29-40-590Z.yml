          - cell [ref=f29e942]:
            - text: "Mar 05, 2004. Mar 06, 2004, DeLaVina: It is easy shown that for graphs on more than one vertex, f(G) ≥ sqrt[path(G)*(b(G)+2)/2], since f(G) ≥ path(G) and f(G) ≥ b(G)/2 + 1, the +1 we get for connected graphs on more than one vertex."
            - paragraph [ref=f29e943]: "Mar. 6, 2004, Ryan Pepper's counterexample follows: \"Take a path on 7 vertices and alternately label its vertices red and blue (pendants are red). Join both vertices of an empty graph on two vertices to every vertex that is red and take another empty graph on two vertices and join both of them to every vertex that is blue. This gives you a bipartite graph on 11 vertices. So, b(G)=11, and f(G) >= p(G) >= 7.\". Further he showed that f(G) = 7."
