id: gemini-aletheia-autonomous-erdos
title: "Gemini Deep Think / Aletheia: autonomous solutions to Erdős #652, #654, #1040, #1051"
date: 2026-01
status: RESOLVED
companion_problems: ["#652", "#654", "#1040", "#1051 (generalized into a paper, BKKKZ26)"]

problem_statement: >
  Four Erdős problems resolved autonomously by DeepMind's Aletheia research
  agent built on Gemini Deep Think. #1051's solution was generalized into a
  standalone research paper. The same system also contributed collaboratively
  to papers on independence polynomials, complexity bounds, arithmetic volumes
  and eigenweights.

