axis_rationale: >
  A=3 is the highest certificate-cost score in the survey. A refutation is a
  specific almost disjoint family with no valid 2-colouring, and the statement is
  elementary enough that a counterexample could plausibly be written down and
  checked in the way the gpt5pro-convex-optimization-bound anchor was -- a
  self-contained argument in a mature area, verifiable in under an hour.
  B1=1 rather than 0: for a family given by a finite description one could in
  principle search 2-colourings of finite initial segments. That is a heuristic
  and not a certificate checker, which is why it is 1 and not 4, and Route W stays
  blocked.
  E=2: almost-disjointness questions on omega are close to the cardinal
  characteristics that are known to be independence-sensitive, but this particular
  statement is not known to be.

unverifiable_claims:
  - "Whether Property B for this class is known to be independent, or merely unproved, is not established. E=2 reflects that uncertainty rather than a sourced determination."
  - "The 'related results' the April 2026 GPT-5.4 search found are not identified on the wiki."
