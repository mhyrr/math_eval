            - text: and later send the following.
            - paragraph [ref=f29e52]: Dec 12, 2004 Fajtlowicz. Let T be a spanning tree containing a maximum matching. Then Graffiti's conjecture follows (for graphs with at least one edge) from the
            - paragraph [ref=f29e53]: Lemma. Let T be a n-vertex tree with L endpoints and n > 1. If T has a matching with m edges then L > n - 2m.
            - paragraph [ref=f29e54]: "Proof: We can assume that n > 3. *Suppose T has two leaves adjacent to a vertex u of degree > 2. Let T' be the tree obtained from T by deletion of one of these leaves,* and let n', L' and m' be the corresponding invariants of T'. Since n' > 1, by induction on n we have that L' > n' - 2m'. Because deg(u) > 2, it follows that L' = L-1, and m' = m. Thus"
            - paragraph [ref=f29e55]: L - 1 > n - 1 - 2m' , i.e., L > n - 2m.
            - paragraph [ref=f29e56]: Suppose now that T has a leaf adjacent to a vertex of degree 2 and let T' be the tree obtained from T by deleting this leaf and its unique neighbor *u*. Clearly m'= m-1 in this case and L' = L if the degree of the other neighbor of u is 2 and L-1 otherwise. In either of these two cases we have
            - paragraph [ref=f29e57]: L >= L' > n' - 2m' >= n - 2 - 2 (m-1) = n - 2m
            - paragraph [ref=f29e58]: and the theorem again follows by induction on n, because n' > 1.
