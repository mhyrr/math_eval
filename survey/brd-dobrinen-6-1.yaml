axis_rationale: >
  G0 = null, and this row is the reason the survey needed that option. Dobrinen
  stated 6.1 in 2021; by 2025 Balko et al. had characterised exactly the
  arity-at-most-two subcase she flagged. A classification question whose
  subquestions fall one at a time does not have a single well-defined open status,
  and asserting one would be the G0 failure this project keeps hitting.
  C=4: the field is an active multi-discipline intersection -- Dobrinen names
  "logic, topological Ramsey spaces, and category theory" as the recent methods,
  and the KPT correspondence links it to topological dynamics. That is the Gowers
  MIXED shape: a problem-solving question being closed with imported machinery.
  E=5: big Ramsey degrees of COUNTABLE structures are statements about countable
  objects and sit squarely inside reverse-mathematics range. Angles d'Auriac,
  Cholak, Dzhafarov, Monin and Patey computed exactly this for Milliken,
  Halpern-Lauchli, Devlin and the Rado graph. This is the only part of the survey
  where the v1.1 reverse-math anchors were the right instrument.
  B2=1 nonetheless: nothing of this theory is formalized in any proof assistant.
  High E with low B2 is precisely the combination the B-split was introduced to
  represent.

unverifiable_claims:
  - "I did not read Balko et al. (2025) and cannot say how much of Problem 6.1 it closes. The relationship between 'finitely constrained free amalgamation classes in finite binary languages' and 'SAP Fraisse classes with relations of arity at most two' is asserted by a search summary, not verified here."
  - "formalizable_without_ambiguity is false because 6.1 is a classification request, not a proposition. There is no single statement to formalize."
