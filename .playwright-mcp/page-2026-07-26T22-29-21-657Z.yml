                      - row [ref=f26e23]:
                        - cell [ref=f26e24]:
                          - text: Written on the Wall II is composed mainly of conjectures of my conjecture-making program Graffiti.pc (G.pc for short) which was inspired by Siemion Fajtlowicz's conjecture-making program Graffiti. Both programs utilize Fajtlowicz's Dalmatian heuristic, however each has its individual implementations. The first 8 conjectures were generated by Graffiti, while I was Fajtlowicz's student, see
                          - link "1996 list(pdf)" [ref=f26e25] [cursor=pointer]:
                            - /url: https://web.archive.org/web/20230901203307/http://cms.dt.uh.edu/faculty/delavinae/research/wowII.pdf
                          - text: for the original list. The remaining conjectures on this list (as of 2001) were generated by Graffiti.pc. Please send information to
                          - link "delavinae@uhd.edu" [ref=f26e26] [cursor=pointer]:
                            - /url: https://web.archive.org/web/20230901203307/mailto:(delavinae@uhd.edu
                          - text: on any of the conjectures on this list.
