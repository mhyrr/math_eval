id: brd-dobrinen-6-1
area: big-ramsey-degrees
title: "Dobrinen Problem 6.1 -- which SAP Fraisse classes have Fraisse limits with finite big Ramsey degrees"
statement: >
  For which SAP Fraisse classes does the Fraisse limit have finite big Ramsey
  degrees? Subquestions: given an SAP Fraisse class with finitely many relations
  and a finite set of forbidden substructures, does its Fraisse limit have finite
  big Ramsey degrees? For such classes with relations of arity at most two, do big
  Ramsey degrees always exist?

sources:
  - url: https://arxiv.org/abs/2110.00655
    what: "Dobrinen, 'Ramsey theory of homogeneous structures: current trends and open problems', ICM 2022 Proceedings. Problem 6.1, p.18."
    tier: PRIMARY
  - url: https://arxiv.org/abs/2505.22620
    what: "Balko, Chodounsky, Dobrinen, Hubicka, Konecny, Vena, Zucker (2025) characterise big Ramsey degrees of Fraisse limits of finitely constrained free amalgamation classes in finite binary languages -- which is the arity-at-most-two subquestion. STATUS OF 6.1 IN GENERAL IS THEREFORE UNCLEAR TO THIS SURVEY."
    tier: PRIMARY

