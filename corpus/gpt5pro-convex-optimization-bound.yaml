  - "Timings (17.5 min generation, 25 min verification) come from Bubeck's own account."

notes: >
  The case that forces a distinction the rest of the corpus lets you blur.

  Three orthogonal properties, and this case separates all three:
    - Is the argument NEW?           yes
    - Is the argument CORRECT?       yes
    - Does it ADVANCE the frontier?  no

  Every other classification scheme in this space - including the teorth wiki's
  1(a)-1(d) - measures provenance, which answers the first question only. A
  tractability rubric that scores a problem as tractable because a model will
  produce a correct new proof of something already known is worse than useless:
  it will fire constantly, on exactly the problems where it has no value.

  This is the strongest argument in the corpus for a FRONTIER axis distinct
  from a certificate axis. See rubric/RUBRIC.md.

  Note also the direction of the error. Bubeck is a strong optimizer who
  verified the proof carefully and still published a claim that did not
  survive contact with the literature. The failure was not mathematical
  competence; it was priority search. That is the same failure mode as the
  October 2025 Erdős episode, from the opposite direction.

