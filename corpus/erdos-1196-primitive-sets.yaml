    what: "Paper, author list, abstract stating method was 'suggested from output of GPT-5.4 Pro'"
    tier: PRIMARY
  - url: https://terrytao.wordpress.com/2026/05/03/primitive-sets-and-von-mangoldt-chains-erdos-problem-1196-and-beyond/
    what: "Tao's account of the work"
    tier: PRIMARY
  - url: https://github.com/teorth/erdosproblems/wiki/Notable-cases-of-AI-contributions-to-Erd%C5%91s-problems
    what: "Listed as one of four notable cases; 'solution to a problem that human experts have already spent substantial effort on'"
    tier: PRIMARY
  - url: https://www.erdosproblems.com/1196
    what: "Problem statement and status"
    tier: PRIMARY

unverifiable_claims:
  - "The precise content of GPT-5.4 Pro's original output, and how much of the final method was already in it, is not public in any source retrieved. 'Suggested from output of' is doing unexamined work."
  - "Tao blog post content summarized via fetch, not read in full."

notes: >
  Tao-wiki category: 1(d) AI collaborating with humans.

  The high-value case for the *opposite* reason to the Jacobian one. Here the
  model's contribution was cheap to produce and enormously expensive to
  validate - the validation being a seven-author paper. This is what
  "AI helped" looks like when the certificate is large.

  A rubric that scores only "did AI contribute" cannot tell this case apart
  from erdos-728. A rubric that scores certificate size separates them
  immediately. That is the argument for keeping certificate size as a
  first-class axis rather than folding it into a general difficulty score.

