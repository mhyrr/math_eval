id: jacobian-conjecture-c3
title: "Counterexample to the Jacobian Conjecture in dimension 3"
date: 2026-07
status: RESOLVED   # pending journal refereeing; certificate itself is machine-checkable

problem_statement: >
  The Jacobian Conjecture (Keller, 1939) asserts that a polynomial map
  F: C^n -> C^n whose Jacobian determinant is a nonzero constant must be
  invertible (with polynomial inverse). It had stood ~87 years. The
  conjecture is known to reduce to the cubic-homogeneous case in all
  dimensions, and by Bass-Connell-Wright reduction it implies the Dixmier
  conjecture on endomorphisms of the Weyl algebra.

field: Algebra
subfield: Affine algebraic geometry / polynomial automorphisms

ai_system: "Claude Fable 5 (Anthropic). Reported secondary use of GPT-5.6 'Sol' and Claude for exploring generalizations after the fact."
human_collaborators:
  - "Levent Alpöge (mathematician, Anthropic) - posed the problem, drove the session, announced"
  - "'Akhil' (per Alpöge's announcement; plausibly Akhil Mathew, NOT confirmed) - co-worked the morning session"
  - "William Thompson - independent verification repository"
autonomy: AI_LED_HUMAN_VERIFIED
# The witness is attributed to the model. The framing, the reduction to the
# cubic-homogeneous case, and the verification are human. Division of labor
# within the session is NOT publicly documented at the level needed to be sure.

resolution_mechanism:
  primary: CONSTRUCTION
  secondary: []
  contested: false
# This is the cleanest CONSTRUCTION in the corpus. The entire mathematical
# content of the claim is three polynomials. Nothing about the search process
# needs to be trusted, believed, or even disclosed.

certificate_size: SMALL
certificate_notes: >
  Three polynomials in three variables. A skeptic computes one 3x3 symbolic
  determinant and checks that three listed points share an image. Both checks
  are exact rational arithmetic, doable in a CAS in under a minute, and
  doable by hand in an afternoon. The reported map:
    a = (1+xy)^3 z + y^2 (1+xy)(4+3xy)
    b = y + 3x(1+xy)^2 z + 3xy^2 (4+3xy)
    c = 2x - 3x^2 y - x^3 z
  with Jacobian determinant identically -2 and generically 3-to-1.
  TRANSCRIBED FROM SECONDARY SOURCE - see unverifiable_claims.

verification_method: COMPUTER_ALGEBRA
verification_status: >
  As of 2026-07-24, days old. Reported: two independently implemented exact
  verifiers agree on the collision points and a nilpotence certificate;
  confirmed in Singular and in Macaulay2; a public repository
  ('explicit-cubic-homogeneous-jacobian-counterexample', W. Thompson) carries
  derivation plus verification code. No journal refereeing yet. No Lean
  formalization reported. Given the certificate size, refereeing is close to
  a formality IF the transcription is right - the risk here is clerical, not
  mathematical.

cross_field_transfer:
  occurred: false
  from: null
  to: null
  notes: >
    No evidence of technique import. The relevant reductions (Bass-Connell-Wright,
    cubic-homogeneous normal form) are standard within the field and long known.
    The scarce resource was the witness, not the theory.

