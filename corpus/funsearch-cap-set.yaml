id: funsearch-cap-set
title: "FunSearch: improved cap set constructions (baseline case, pre-dates the 2025-26 wave)"
date: 2023-12
status: RESOLVED   # bound improved; cap set problem remains open

problem_statement: >
  A cap set is a subset of F_3^n containing no three points in a line
  (no nontrivial 3-term arithmetic progression). Determining the maximum size
  is a central open problem in additive combinatorics. FunSearch - an LLM
  proposing Python programs, filtered by an automated evaluator, iterated
  evolutionarily - discovered constructions of large cap sets exceeding the
  best previously known, in both fixed dimension and asymptotically.

field: Combinatorics
subfield: Additive combinatorics

ai_system: "FunSearch (Google DeepMind) - LLM + evaluator + evolutionary loop"
human_collaborators:
  - "DeepMind team with Jordan Ellenberg - problem framing and evaluator design"
autonomy: AUTONOMOUS   # within a human-specified evaluator

resolution_mechanism:
  primary: SEARCH_PLUS_VERIFIER
  secondary: [CONSTRUCTION]
  contested: false

certificate_size: SMALL
certificate_notes: >
  The output is a program that emits an explicit set; checking is mechanical.
  Published in Nature - the strongest formal publication status of any case in
