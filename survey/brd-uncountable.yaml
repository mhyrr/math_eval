axis_rationale: >
  E=1 and this row is why the rebuilt axis has that band. The known results here
  are not ZFC theorems: Shelah's Halpern-Lauchli at kappa assumes a measurable
  cardinal, and the Dzamonja-Larson-Mitchell characterisations inherit that. The
  live question is consistency strength -- how much large cardinal is actually
  needed -- which is a different kind of question from anything in the Phase 1
  corpus and is invisible to the reverse-mathematics ladder the v1.1 axis used.
  Contrast brd-dobrinen-6-1 at E=5. The same subject at countable and uncountable
  cardinality lands five bands apart. That spread is the strongest evidence that
  the rebuilt axis is measuring something real rather than reproducing a constant.
  B2=0: no proof assistant has large-cardinal-relative combinatorics at all.

unverifiable_claims:
  - "No specific open question is stated here -- Dobrinen characterises the area rather than posing a numbered problem. This row scores an area, which is weaker than the rest of the survey and should be read as such."
  - "Whether the large-cardinal hypotheses in Shelah's and Zhang's results are necessary or merely sufficient is not established here. E=1 assumes they are load-bearing."
