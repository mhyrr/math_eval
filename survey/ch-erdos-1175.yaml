id: ch-erdos-1175
area: ch-adjacent-combinatorics
title: "Erdos #1175 -- triangle-free subgraphs of prescribed uncountable chromatic number"
statement: >
  Let kappa be an uncountable cardinal. Must there exist a cardinal lambda such
  that every graph with chromatic number lambda contains a triangle-free subgraph
  with chromatic number kappa? Shelah proved that a negative answer is consistent
  when kappa = lambda = aleph_1, so the statement is not provable in ZFC.

