notes: >
  Tao-wiki category: 1(d) AI collaborating with humans.

  The most instructive failure inside a success. AI deep-research tools
  ATTEMPTED and FAILED to find the prior literature; human Google Scholar
  searching worked better initially. The problem was ultimately closed by a
  human locating a 2024 paper. In the one case where the corpus has a detailed
  play-by-play, the retrieval capability that the October 2025 GPT-5 episode
  suggested was the models' strongest suit did not fire.

  Tao's own summary is the sober one: the proof "turned out to not be
  particularly novel," and the innovation was ORGANIZATIONAL - orchestrating
  known results from 1959, 1980, 2016 and 2024 into a unified solution, at a
  speed no single mathematician would have managed.

  Rubric consequence: there is a real and valuable mode here - compression of
  calendar time on problems that were always solvable - that is entirely
  distinct from advancing the frontier. A tractability rubric that cannot
  distinguish "an AI-assisted group will close this in 48 hours" from "an AI
  will discover something new here" will mislead. Phase 3 should score these
  separately.
