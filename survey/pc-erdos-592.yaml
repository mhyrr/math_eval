id: pc-erdos-592
area: partition-calculus
title: "Erdos #592 -- which countable ordinals beta satisfy omega^beta -> (omega^beta, 3)^2"
statement: >
  Determine which countable ordinals beta have the property that, with
  alpha = omega^beta, every red/blue colouring of the edges of the complete graph
  on alpha contains either a red clique of order type alpha or a blue triangle.

sources:
  - url: https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/ErdosProblems/592.lean
    what: "Lean statement, `@[category research open, AMS 3]` at repo HEAD 7587c62 (2026-07-25)."
    tier: PRIMARY
  - url: https://www.isa-afp.org/entries/Ordinal_Partitions.html
    what: "Paulson, Ordinal Partitions (AFP, 2020-08-03). Formalizes Larson's omega^omega -> (omega^omega, m)^2, Specker's omega^2 -> (omega^2, m)^2, and an Erdos-Milner result. This is the ambient theory for the present problem, formalized."
    tier: PRIMARY
  - url: https://www.tandfonline.com/doi/full/10.1080/10586458.2021.1980464
    what: "Dzamonja, Koutsoukou-Argyraki, Paulson, 'Formalizing Ordinal Partition Relations Using Isabelle/HOL', Experimental Mathematics 31(2) 383-400 (2022). The project report on the above."
    tier: PRIMARY

