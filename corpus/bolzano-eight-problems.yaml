id: bolzano-eight-problems
title: "Bolzano: eight problems in mathematics and TCS via multi-agent prover/verifier"
date: 2026-04
status: RESOLVED

problem_statement: >
  An open-source multi-agent LLM system orchestrating rounds between parallel
  prover agents and a verifier agent, applied to eight problems in mathematics
  and theoretical computer science. Six of eight reached publishable research
  quality; five of eight were produced essentially autonomously.

