notes: >
  Recorded as a separate case from erdos-90-unit-distance because it isolates
  a phenomenon the flagship case would otherwise hide: what the AI produced was
  NOT the finished mathematical good.

  The model proved existence with an unnamed constant. Within days a human
  produced the number, and within weeks a small literature existed on
  optimizing the certificate. The AI's output was the opening of a route; the
  field did the rest, fast.

  Rubric consequence: score the certificate the AI would actually produce, not
  the certificate the finished mathematics will eventually have. These differ
  systematically, and the gap is filled by human specialists at high speed once
  the route is known. A tractability rubric aimed at "can AI resolve this"
  should probably be aimed instead at "can AI open the route" - which is a
  lower and much more frequently cleared bar, and is the bar this corpus
  actually supports.
