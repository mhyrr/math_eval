id: ch-erdos-1119-CONTROL
area: ch-adjacent-combinatorics
title: "Erdos #1119 -- CONTROL: known independent of ZFC (Wetzel-type problem on entire functions)"
statement: >
  Let m be an infinite cardinal with aleph_0 < m < c. Let {f_alpha} be a family of
  entire functions such that for every z_0 in C there are at most m distinct values
  f_alpha(z_0). Must {f_alpha} have cardinality at most m? The answer is yes if
  m^+ < c, so the question reduces to m^+ = c, where it is UNDECIDABLE: Kumar-Shelah
  (2017) produced a model of c = aleph_2 in which the answer is yes with m = aleph_1;
  Schilhan-Weinert (2024) produced a different model of c = aleph_2 in which it is no.

sources:
  - url: https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/ErdosProblems/1119.lean
    what: "Lean statement at repo HEAD 7587c62 (2026-07-25). Headline theorem carries answer(sorry) with the comment that the question 'is independent of ZFC... neither provable nor refutable from the usual axioms of set theory'. The Erdos (1964) results under c > aleph_1 and under CH are formalized separately as `research solved` variants."
    tier: PRIMARY
  - url: https://www.isa-afp.org/entries/Wetzels_Problem.html
    what: "Paulson, 'Wetzel's problem' (AFP). The classical Erdos 1964 CH-equivalence formalized in Isabelle/HOL, combining complex analysis with ZFC_in_HOL. Demonstrates that CH-EQUIVALENCES are formalizable even though CH-INDEPENDENCE is not."
    tier: PRIMARY

