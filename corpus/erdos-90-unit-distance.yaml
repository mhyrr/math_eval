unverifiable_claims:
  - "The specific model is not named by OpenAI beyond 'internal reasoning model'. No independent party has audited the claim that human input was limited to the prompt."
  - "Kalai's blog reports later refinements (n^1.0318, ceiling 1.2143) and an Anthropic independent confirmation; these were read via automated fetch summary and are not separately sourced here."
  - "Solymosi's remark that mathematicians 'had tried to construct a counterexample' is reported via Kalai, not traced to a primary statement."

notes: >
  Tao-wiki category: 1(a) AI standalone. The flagship case of the corpus and
  the one that most stresses the rubric.

  Three lessons that survive into Phase 2:

  1. Counterexample does NOT imply small certificate. Press coverage treats
     "disproved by counterexample" as self-evidently checkable. Here the
     counterexample was an existence proof with an inexplicit constant. The
     rubric must score the certificate that actually exists, not the one the
     problem's logical form suggests.

  2. The transfer direction was from a technique-rich field (ANT) into a
     technique-poor one (unit distances). This asymmetry is scoreable and is
     the basis of the 'adjacent technique reservoir' axis.

  3. Prior expert attention did NOT protect the problem. Erdős #90 had
     widespread attention and fell anyway - so "many people have tried" is
     weak evidence of intractability, whereas "the field has no adjacent
     reservoir to import from" may be strong evidence. This directly shapes
     how Phase 3 should treat heavily-attacked set theory problems.
