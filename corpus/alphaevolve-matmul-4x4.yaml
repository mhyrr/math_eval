id: alphaevolve-matmul-4x4
title: "AlphaEvolve: 4x4 matrix multiplication in 48 scalar multiplications"
date: 2025-05
status: RESOLVED

problem_statement: >
  Strassen's 1969 algorithm multiplies 4x4 matrices in 49 scalar
  multiplications, and that stood for over 50 years. AlphaEvolve found a more
  general version of an improved algorithm using 48, over the complex numbers,
  extending AlphaTensor's earlier result. Not an open conjecture: an
  optimization over a well-defined space of bilinear algorithms.

field: Algebraic Complexity
subfield: Fast matrix multiplication

