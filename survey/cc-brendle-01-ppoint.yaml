axis_rationale: >
  Included because it carries the survey's third documented instance of a
  published error in this territory: Cohen claimed a P-point in the standard
  random model and the argument was flawed. With the Mildenberger withdrawal and
  the Goldstern-Kellner-Mejia-Shelah evasion-number gap, that is three
  independent expert-level errors surviving publication in cardinal
  characteristics -- which is the empirical case for A=1 across this slice.
  form=EXISTENTIAL is a trap and worth recording as one. "Is there a P-point"
  looks existential and therefore witnessable, but the P-point lives in a forcing
  extension and is a non-principal ultrafilter on omega. It has no finite
  presentation, so D=0 and Route W is blocked regardless of form. This is the
  same error the rubric caught on erdos-90 -- scoring the certificate the
  statement's logical form suggests rather than the one that exists.

unverifiable_claims:
  - "Current open status unverified (2017 source)."
  - "The attribution of the flaw to Guzman and Hrusak is Brendle's; I did not read their note."
