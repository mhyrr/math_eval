axis_rationale: >
  A classical problem, attributed to Miller and unresolved long enough to have
  acquired a folklore reduction. It scores identically to the rest of this slice
  on every axis, which is itself the finding: within cardinal characteristics the
  rubric has no resolving power, because A, B1, B2, D and E are pinned at the
  bottom by the shape of the questions rather than by anything about the
  individual problems.

