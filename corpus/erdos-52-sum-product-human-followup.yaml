id: erdos-52-sum-product-human-followup
title: "Erdős #52: sum-product conjecture disproved for the reals (human, AI-inspired)"
date: 2026-05
status: RESOLVED

problem_statement: >
  The Erdős-Szemerédi sum-product conjecture asserts that for any finite set A
  of reals, max(|A+A|, |AA|) is at least |A|^(2-o(1)) - a set cannot be close
  to structured under both addition and multiplication. Bloom, Sawin,
  Schildkraut and Zhelezov disproved it, constructing sets with
  max(|A+A|, |AA|) <= |A|^(2-c) for an absolute constant c > 0. They also
  disprove the generalized many-sums-and-products conjecture and transfer the
  counterexamples to p-adics, finite fields and function fields.

field: Number Theory
subfield: Additive combinatorics

ai_system: "NONE - no AI involvement stated in the paper"
human_collaborators:
  - "Thomas F. Bloom, Will Sawin, Carl Schildkraut, Dmitrii Zhelezov"
