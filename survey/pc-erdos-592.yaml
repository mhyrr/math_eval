axis_rationale: >
  B2=3 is the highest formal-library score anywhere in this survey, and it is the
  single most consequential axis call in Phase 3. The ambient theory here --
  ordinal partition relations at countable ordinals -- is genuinely formalized:
  Larson, Specker and Erdos-Milner are all in the Isabelle/HOL AFP entry
  Ordinal_Partitions, built on ZFC_in_HOL. This matches the erdos-728 anchor
  ("mathlib covers the ambient theory") rather than the alphaevolve anchor
  ("nothing formalized"). It is B2=3 in Isabelle/HOL, NOT in Lean -- the
  distinction matters because every AI system in the Phase 1 corpus that used
  Route F used Lean.
  E=4: countable ordinals are countable objects, so unlike the rest of this
  survey the reverse-mathematics ladder actually applies here. Statements of this
  form sit in the ACA0-ATR0 region rather than beyond ZFC.
  D=2: a refuting colouring of [omega^beta]^2 is an infinite object, but at a
  countable ordinal it admits a countable code, which is more than can be said
  for the uncountable cases.

unverifiable_claims:
  - "I did not verify the exact reverse-mathematical strength of this particular relation. E=4 is inferred from the general fact that countable-ordinal partition relations are statements of second-order arithmetic, not from a paper computing the strength of this statement."
  - "Whether the Isabelle/HOL Ordinal_Partitions development is close enough to this specific problem to serve as a starting point is a judgement, not a sourced claim. It covers neighbouring theorems, not this one."
