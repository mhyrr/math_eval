axis_rationale: >
  Scored to fail G0 -- it is settled, in the specific sense that its
  undecidability is established. Included because it is the survey's calibration
  point for the boundary the whole phase turns on.
  Compare the two halves. Erdos's 1964 theorems -- "if c > aleph_1 then every such
  family is countable" and "under CH there is an uncountable one" -- are ZFC
  theorems about a CH hypothesis, and Paulson formalized exactly this class of
  statement in Isabelle/HOL as Wetzel's problem. The Kumar-Shelah and
  Schilhan-Weinert model constructions are consistency statements, and DeepMind's
  file records them in PROSE, outside any theorem, with the note that "consistency
  statements about models of ZFC are not directly formalizable inside Lean's fixed
  model".
  Same problem. One half formalized in a proof assistant, the other half written
  in a comment because it cannot be. That is the B2 bifurcation made visible
  inside a single file, and it is why B2 for this territory is neither 0 nor 3 but
  depends entirely on which side of the line a question falls.

unverifiable_claims:
  - "I did not read Kumar-Shelah (2017) or Schilhan-Weinert (2024). The independence claim is DeepMind's, sourced to those two papers in the Lean file's reference block."
