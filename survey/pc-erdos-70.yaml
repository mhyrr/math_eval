axis_rationale: >
  A=2: a partition-calculus paper; the community able to check it is small but a
  result of this shape is days-to-weeks of specialist reading, comparable to the
  erdos-90 anchor rather than the 35-page erdos-1196 anchor.
  B1=0: refuting the relation means exhibiting a colouring of [c]^3. There is no
  automatic checker for a colouring of an uncountable set -- the object is not
  finitely presentable to an evaluator, so nothing can be run against it.
  B2=2: mathlib supplies Cardinal and Ordinal but nothing about partition
  relations; formal-conjectures had to define OrdinalCardinalRamsey3 itself in
  FormalConjecturesForMathlib. The statement is expressible, the ambient theory
  is not covered.
  D=1: even on the refutation side the witness is a colouring of an uncountable
  set. This is the erdos-90 shape, not the jacobian shape.
  E=3: a ZFC statement about c. Erdos-Rado settled the omega+n case in ZFC, so
  the question is not obviously CH-sensitive, but the objects are uncountable and
  reverse mathematics cannot reach them.

