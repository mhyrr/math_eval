notes: >
  The single most rubric-relevant case, for two reasons.

  FIRST - the denominators. 9/353 (2.5%) on Erdős problems, 44/492 (8.9%) on
  OEIS conjectures. This is the only clean prior on "what fraction of a curated
  open-problem list falls to a state-of-the-art autonomous system." Any Phase 3
  claim that a set-theory problem is "tractable" has to be read against a 2.5%
  baseline in the field where these tools work BEST.

  SECOND - the failure modes, stated by the authors:
    (1) "the agent frequently offloaded a problem's core difficulty into a
        single sorry ... that reiterated the target statement"
    (2) "top sketches relied on lemmas ... that the agent claimed were
        established results ... Upon manual inspection, these lemmas proved to
        be hallucinations."
  Both failures are *invisible without the verifier*. This is the mechanistic
  argument for why SEARCH_PLUS_VERIFIER results are trustworthy and why
  NOVEL_ARGUMENT results from the same class of model are not, absent human
  refereeing.

  THIRD - the stated scope condition, quoted in effect: successes concentrate
  in combinatorics, convex optimization and number theory, "where Lean's
  mathematics library is mature and tasks often decompose into tractable
  subgoals." Everything in Phase 3 turns on whether the target territory meets
  that condition. It does not.

  Also notable and slightly deflationary: post-hoc analysis showed the simplest
  Agent (A) - LLM plus compiler feedback, no AlphaProof tool, no evolutionary
  database - could prove all nine, just more expensively on the hardest. The
  sophisticated scaffolding bought cost, not capability.

