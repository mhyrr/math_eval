        - cell "April 21, 2004. July 2005, for large enough circumference(G), the conjecture follows from the proposition below. Proposition. If G is a simple connected graph, then b(G) ≥ a(G) + FLOOR(circumference(G)/4). Proof. Note circumference(G) => 3. Let C be the set of vertices of a largest induced cycle. Let I be the set of vertices of a maximum independent set. Color the vertices of I with color green. Since the intersection of C and I is at most FLOOR(circumference(G)/2), there are at least FLOOR(circumference(G)/4) vertices of C that can be colored red. Hence, G has an induced bipartite subgraph on at least a(G) + FLOOR(circumference(G)/4) vertices. October 12, 2006. Benny John." [ref=f32e2209]:
