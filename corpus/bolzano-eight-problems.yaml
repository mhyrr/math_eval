notes: >
  Included specifically as a warning about denominators, which is the main way
  this literature misleads.

  Three success rates in this corpus, all real, all incomparable:
    - 6/8   (75%)  Bolzano, problems chosen by the researchers
    - 9/353 (2.5%) AlphaProof Nexus, curated open Erdős list
    - 5/700 (0.7%) Gemini screen, near-exhaustive over the open database

  The rate falls by two orders of magnitude as selection freedom decreases. A
  headline "AI solves 75% of research problems" and "AI solves 0.7% of research
  problems" can both be true of the same generation of systems.

  Direct Phase 3 consequence: when scoring the survey, state which regime the
  score is in. If problems are hand-picked FOR tractability by someone with
  taste, the relevant prior is nearer the Bolzano end. If they are drawn from
  a standing list of famous open problems, it is nearer 1-3%. The rubric should
  make the analyst declare which they are doing.

