id: erdos-1026-monotone-subsequence
title: "Erdős #1026: maximum monotone subsequence sum, resolved by orchestrated collaboration"
date: 2025-12
status: RESOLVED

problem_statement: >
  Erdős (1975) asked for c(n), the largest constant such that every sequence
  x_1..x_n of nonnegative reals has a monotone subsequence whose sum is at
  least c(n) times the total sum. The resolved answer has the form
  c(k^2 + 2a + 1) = k/(k^2 + a), connecting the question to square- and
  rectangle-packing results.

field: Combinatorics
subfield: Extremal combinatorics / sequences

ai_system: "Aristotle (Harmonic), AlphaEvolve (Google DeepMind), ChatGPT, and AI deep-research tools - four distinct tools at four distinct stages"
human_collaborators:
  - "Desmond Weisenberg - formalized the question"
  - "Stijn Cambie - upper bounds, small-n values, the c(k^2)=1/k conjecture"
  - "Wouter van Doorn - lower bounds from literature"
  - "Boris Alexeev - operated Aristotle; formulated the sharp conjecture"
  - "Koishi Chan - alternate proof via Erdős-Szekeres blow-up"
  - "Lawrence Wu - located the decisive Baek-Koizumi-Ueoro (2024) paper"
  - "Terence Tao - operated AlphaEvolve; wrote the account"
autonomy: AI_ASSISTED
# Four AI tools, none of which produced the result. The decisive step was a
# human finding a 2024 paper.

resolution_mechanism:
  primary: LITERATURE_RECALL
  secondary: [SEARCH_PLUS_VERIFIER, CONSTRUCTION]
  contested: true
# Contested and worth arguing about. The problem was closed when Lawrence Wu
# found Baek-Koizumi-Ueoro (2024) on square packing, which combined with
# Praton's embedding argument gave the full result. Everything the AI did was
# upstream scaffolding: Aristotle formalized a reformulation Tao judged "not
# particularly novel", AlphaEvolve produced numerics that revealed the
# pattern, ChatGPT synthesized write-ups. Classified by what closed it.

certificate_size: MEDIUM
certificate_notes: >
  The final argument assembles four existing results (Seidenberg 1959, Steele
  1980, Tidor-Wang-Yang 2016, Baek-Koizumi-Ueoro 2024) plus a Lean-verified
  asymptotic component. No single object to check, but no new theory to absorb
  either. A combinatorialist verifies in days by chasing citations.

verification_method: LEAN
verification_status: >
  Multiply verified and unusually robustly so: Aristotle's Lean proof of the
  asymptotic bound, Koishi Chan's independent classical proof via
  Erdős-Szekeres blow-up, and the connection to published square-packing
  results. Documented in Tao's 2025-12-08 blog post. Elapsed time from problem
  posting to resolution: roughly 48 hours of active work spread over ~3 months.

cross_field_transfer:
  occurred: true
  from: "Discrete geometry (square/rectangle packing)"
  to: "Extremal combinatorics (monotone subsequences)"
  notes: >
    Real but human-mediated. Aristotle independently found the rectangle-packing
    reformulation, which is the transfer; but the payoff came from a human
    locating the packing literature. The AI found the bridge and could not
    cross it.

