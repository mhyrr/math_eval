notes: >
  Included deliberately even though NO AI touched it. This is the corpus's only
  measurement of a second-order effect, and it may be the largest effect in the
  whole dataset.

  The sequence: an AI disproves Erdős #90 using class-field-tower machinery
  imported into combinatorial geometry. Within days, human experts - two of
  whom (Bloom, Sawin) had just spent that week digesting the AI's argument -
  use the same circle of ideas to disprove the sum-product conjecture, a
  problem of comparable or greater standing. By hand.

  The AI's real contribution here was not a proof. It was a demonstration that
  a particular technique reservoir was live for this class of problem. Once
  shown, humans drained it faster than the machine did.

  Rubric consequence, and it cuts against the obvious reading of the corpus:
  the highest-value AI intervention may be technique-route DISCOVERY on one
  problem, which then unlocks a cluster by conventional means. If so, Phase 3
  should not ask only "which single problem can an AI close" but "which
  problem, if closed, would reveal a reservoir for the neighbourhood." Those
  are different questions with different answers.
