axis_rationale: >
  C=4: the KPT correspondence is the paradigm case of machinery imported from
  topological dynamics into structural Ramsey theory, and 6.3 asks to complete an
  import that is already half done.
  A=1: establishing a correspondence theorem is not a short certificate. The
  Hubicka-Zucker survey exists because the results were scattered enough to need
  unifying, which is itself evidence of verification cost.
  G0 = null: Hubicka-Zucker (2024/25) explicitly advances the first half. How much
  of 6.3 survives is not determined here.

unverifiable_claims:
  - "I read the Hubicka-Zucker abstract, not the paper. Whether 'standard proof methods automatically yield such structures' answers Dobrinen's first question in general or only for the classes they treat is unknown to this survey."
