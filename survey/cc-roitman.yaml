axis_rationale: >
  E=0: the question IS a consistency question. Per DeepMind's own note in
  FormalConjectures/ErdosProblems/1175.lean, "Lean operates inside a single
  (fixed) model of its set theory, so we cannot directly express 'consistent with
  ZFC' without leaving ZFC." The certificate cannot be presented to any proof
  assistant, so B2=0 is structural rather than a coverage gap that better
  libraries would close.
  A=1, and this row supplies the survey's hardest empirical evidence for it.
  Mildenberger's claimed solution was posted, cited, and withdrawn ten months
  later for a flawed lemma. That is a direct measurement of how long an error
  survives in this subfield, made on an expert rather than a model.
  D=0: the answer is a statement about all models of a theory. This is the exact
  wording of the D=0 anchor in RUBRIC.md, and this territory is where that anchor
  finally gets an occupant -- it was unused in the Phase 1 corpus.

unverifiable_claims:
  - "The arXiv abstract page gives the withdrawal but I did not independently confirm the current open status of Roitman's problem from a 2025-26 primary source. The 'remains open' claim rests on a search summary of a lecture-note PDF, tier EXPERT_COMMENTARY, not on a paper I read."
  - "Roitman posed more than one problem. That the withdrawn Mildenberger paper and the question scored here concern the same one is asserted by the paper's title and abstract, not independently verified."
