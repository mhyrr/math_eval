axis_rationale: >
  G1 = FAIL on the source's own words. Brendle names the missing ingredient --
  completeness of embeddings in a three-dimensional matrix iteration -- and no
  such technique existed when he wrote. A problem whose expert statement is "here
  is the approach and here is the machinery that does not yet exist" is the
  cleanest G1 failure in the survey.
  This row also shows what "reservoir" means in this subfield. The machinery
  being reached for is not another field's; it is a hypothetical extension of the
  subfield's own tool, one dimension up. That is theory-building, not transfer,
  and Route R is not what it needs.

unverifiable_claims:
  - "Whether three-dimensional matrix iterations have since been made to work is unverified. Brendle notes in 2017 that Fischer-Friedman-Mejia-Montoya used them once, in a 'rather special' setting."
  - "Current open status unverified (2017 source)."
