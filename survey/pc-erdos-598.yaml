id: pc-erdos-598
area: partition-calculus
title: "Erdos #598 -- colouring countable subsets with (2^aleph_0)^+ colours"
statement: >
  Let m be an infinite cardinal and let kappa = (2^aleph_0)^+ be the successor of
  the continuum. Can one colour the countable subsets of m using kappa many
  colours so that every X subset of m with |X| = kappa contains subsets of all
  possible colours?

