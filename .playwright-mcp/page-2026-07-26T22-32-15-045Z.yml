        - cell [ref=f32e105]:
          - text: "1996. Mar. 17, 2004: Ryan Pepper \" Here, MID is the number of vertices in a minimum independent dominating set. Take any vertex v of max degree D from graph G with n vertices and remove all vertices adjacent to v leaving G'. Now, any independent dominating set of G' must include v and so is also an independent dominating set of G. But there are at most n-D vertices in any independent dominating set of G'. Therefore, MID <= n-D, since MID is cardinality of a minimum independent dominating set. The rest of proof is as even more of an exercise than this and goes as follows. For any graph, max(temp) <= D/(n-D), D is max degree. So,"
          - paragraph [ref=f32e106]: MID(max(temperature)) <= (n-D)D/(n-D) = D <= Max number of leaves of spanning tree.
          - paragraph [ref=f32e107]: The last inequality because, starting from a vertex x of maximum degree, we can build a spanning tree by including first all vertices of distance one from x, then all vertices of distance two from x, etc .... This will give spanning tree with a vertex of maximum degree D, and every tree has at least as many leaves as its maximum degree."
