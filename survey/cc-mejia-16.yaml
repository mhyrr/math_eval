axis_rationale: >
  G1 = FAIL: Brendle states that the dual construction is unknown because the key
  step has no known replacement, and names multi-dimensional matrix iteration as
  a hoped-for technique rather than an available one.
  The Cichon's maximum history is the survey's one clean demonstration that Axis
  E's lower bands track something real and movable. Separating ten Cichon values
  required four strongly compact cardinals in 2017 (Goldstern-Kellner-Shelah) and
  required nothing beyond ZFC by 2022 (with Mejia). The problem did not change;
  the forcing technique did. Under the v1.1 reverse-mathematics anchors that
  five-year movement is invisible, because the whole episode happens above the
  top of the Big Five ladder.

unverifiable_claims:
  - "Current open status unverified (2017 source). Given that Brendle's Problem 13 in the same list was overtaken by Cichon's maximum, this row may be too."
