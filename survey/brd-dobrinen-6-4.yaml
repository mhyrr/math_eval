axis_rationale: >
  G1 = FAIL: "develop" is a programme, not a proposition. Dobrinen's own framing
  -- that a theorem in this direction is being written down by her and requires
  coding trees "necessitated to be diagonal" -- is a description of framework
  construction, which is the G1 disqualifying condition.
  E=4: the objects are subspaces of the Baire space, so second-order arithmetic
  reaches them, but the Galvin-Prikry and Ellentuck theorems sit at the upper end
  of the ladder rather than the bottom.

unverifiable_claims:
  - "Dobrinen said in 2021 that such a theorem 'is being written down'. Whether it appeared between 2021 and 2026 was not checked. This row's open status is stale by five years and G0 is null accordingly."
