notes: >
  The mechanism with the sharpest applicability boundary in the corpus, and
  therefore the most useful for Phase 3 scoring.

  AlphaEvolve requires three things simultaneously: (i) the answer is a finite
  object, (ii) there is a cheap automated evaluator, (iii) the search space
  admits gradient-like improvement so evolution has signal. All three hold for
  packing and kissing numbers. Note what the improvements look like when they
  land: 592 to 593, and 0.380927 to 0.380924. Real, checkable, and tiny. This
  mechanism moves constants; it does not settle conjectures.

  For Phase 3 this is close to dispositive on one axis. Questions about
  cardinal characteristics and partition relations have answers that are
  cardinals or consistency statements, not finite objects. There is no
  evaluator to run. Even where a combinatorial question adjacent to CH has a
  finite-object flavour, the quantity of interest is usually a statement about
  ALL models of ZFC. AlphaEvolve-style search has no purchase there, and this
  should be scored as a hard zero rather than a low number.
